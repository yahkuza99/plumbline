[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plumbline-dicom"
version = "0.1.0"
description = "A lossless JPEG (ITU-T T.81 SOF3) decoder that is right, or says so"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Rungroj T." }]
keywords = ["jpeg", "lossless", "dicom", "decoder", "codec", "medical imaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Multimedia :: Graphics",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
# The compiled core is the default and needs nothing extra. numba is only a
# fallback for platforms with no wheel; it decodes greyscale and is slower to
# start. Most people should not install it.
turbo = ["numba>=0.57"]
# pydicom is only used to pull frames out of real discs in the corpus tests;
# the decoder itself never touches it.
test = ["pytest>=7", "pydicom>=2.4"]

[project.urls]
Homepage = "https://github.com/yahkuza99/plumbline"
Issues = "https://github.com/yahkuza99/plumbline/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/plumbline"]
artifacts = ["src/plumbline/_plumbline.*"]

# Tags the wheel for the platform whose binary it carries — see hatch_build.py.
# Without it the wheel claims to be `any` while holding a Windows .dll.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Everything needed to run the suite the project asks people to run, plus
# the corpus the paper invites them to reuse. "README.md" alone matched
# conformance/README.md and nothing else in that directory, so an sdist
# carried one file of a 1,707-frame corpus and a test suite that could not
# collect.
include = [
    "src/",
    "native/",
    "tests/",
    "conformance/",
    ".githooks/",
    "hatch_build.py",
    "/README.md",
    "/CORRECTNESS.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/MAINTENANCE.md",
    "/CITATION.cff",
    "/LICENSE",
    "/NOTICE",
]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
