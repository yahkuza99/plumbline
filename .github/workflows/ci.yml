# Build the decoder core on every OS we ship a wheel for, and prove it
# against the reference implementation on each one.
#
# The C is plain C11 with no dependencies, so each runner's own system
# compiler is enough: MSVC on Windows, clang on macOS, gcc on Linux. Nothing
# is downloaded to build it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.12", artifact: _plumbline.dll }
          - { os: ubuntu-latest,  python: "3.12", artifact: _plumbline.so }
          - { os: ubuntu-latest,  python: "3.9",  artifact: _plumbline.so }
          - { os: macos-latest,   python: "3.12", artifact: _plumbline.dylib }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the decoder core
        run: python native/build.py

      - name: Install test dependencies
        run: pip install numpy pydicom pytest

      - name: Decode like the reference, bit for bit
        run: python -m pytest tests/ -q

      - uses: actions/upload-artifact@v4
        with:
          name: plumbline-${{ runner.os }}-py${{ matrix.python }}
          path: src/plumbline/${{ matrix.artifact }}

  # The reference implementation is the thing every other test measures
  # against, so it has to pass with numba absent and the core unbuilt —
  # otherwise a green suite might only mean the fast paths agree with
  # each other.
  reference-alone:
    name: reference implementation, nothing else installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: python -m pytest tests/test_reference.py -q

  no-patient-data:
    name: no medical images, anywhere in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `fetch-depth: 0` gets branches and tags. It does not get refs outside
      # `refs/heads/*` and `refs/tags/*` — notes, `refs/replace`, anything a
      # tool invented — so a blob attached with `git notes add` and pushed
      # explicitly was present on the remote and absent from the gate that is
      # supposed to be the mandatory one. Fetch those too before scanning.
      - name: Fetch every ref, not only branches and tags
        run: |
          git fetch --no-tags --prune origin \
            '+refs/notes/*:refs/notes/*' \
            '+refs/replace/*:refs/replace/*' || true
          git for-each-ref --format='%(refname)' | sed 's/^/  /'

      # The same scanner the pre-commit and pre-push hooks run, over every blob
      # ever committed. It is deliberately the same file: this check used to
      # exist twice, and the weaker copy was the one that always ran, because a
      # hook is opt-in and CI is not.
      - name: Scan every blob ever committed
        run: python .githooks/scan_staged.py --history

      # A guard nobody tests is a guard that has already failed.
      - name: Prove the scanner still catches decoys
        run: |
          pip install pytest
          python -m pytest tests/test_hook.py -q

  package:
    name: the distribution does what the README promises
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build numpy pytest twine auditwheel

      # `python -m build` with no arguments builds the wheel from the sdist,
      # which cannot carry a binary, so the obvious command yields a
      # `py3-none-any` wheel that pip would then prefer on every platform. The
      # two steps below are the release procedure precisely because the one
      # step is wrong, and check_dist.py is what refuses the wrong one.
      - name: Build the core, then the distributions
        run: |
          python native/build.py
          python -m build --sdist
          python -m build --wheel --no-isolation

      # `sysconfig.get_platform()` reports `linux_x86_64`, which PyPI rejects
      # on upload and which records no glibc floor, so it says nothing about
      # which systems the binary will actually run on. auditwheel reads the
      # .so's own symbol versions and retags it `manylinux_<major>_<minor>`
      # accordingly — the tag is then a measured fact rather than a guess.
      - name: Retag the Linux wheel as manylinux
        run: |
          auditwheel repair dist/*-linux_*.whl -w dist/
          rm -f dist/*-linux_x86_64.whl

      - name: Refuse a distribution that cannot keep the promise
        run: python tools/check_dist.py dist/

      - run: twine check dist/*

      # The suite shipped inside the tarball has to pass, because a packager or
      # an auditor deciding whether to trust this project runs exactly that.
      - name: Run the test suite from inside the sdist
        run: |
          mkdir -p /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/* && python -m pytest tests/ -q

      # And the wheel has to deliver the compiled core to a clean machine —
      # the claim is "no build step", and nothing else here tests it.
      - name: Install the wheel somewhere clean and check the engine
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet numpy dist/*.whl
          test "$(/tmp/clean/bin/python -c 'import plumbline; print(plumbline.engine())')" = native
